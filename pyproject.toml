[project]
name = "ember-playground"
version = "0.1.0"
description = "Small, audited weight-writing experiments."
requires-python = ">=3.12"
dependencies = ["minatar==1.0.15", "numpy>=2", "pydantic>=2,<3", "rich>=14"]

[project.optional-dependencies]
gpu = ["torch>=2"]

[project.scripts]
ember = "ember.cli:main"

[dependency-groups]
dev = ["mypy", "pyright", "pytest", "ruff", "ty"]

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ember"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
python_files = ["*.py"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
# The optional GPU extra provides torch; CPU-only environments omit it.
allowed-unresolved-imports = ["torch", "torch.**"]

[tool.mypy]
files = ["src", "tests"]

[[tool.mypy.overrides]]
# MinAtar has no type stubs. PyTorch is an optional runtime dependency.
module = ["minatar", "minatar.*", "torch", "torch.*"]
ignore_missing_imports = true
